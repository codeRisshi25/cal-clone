name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calclone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: cd packages/db && npx prisma generate

      - name: Setup Database
        run: cd packages/db && DATABASE_URL=postgresql://postgres:postgres@localhost:5432/calclone_test npx prisma db push --accept-data-loss

      - name: Run Tests
        run: pnpm test

      - name: Deploy to Azure (Main Branch Only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: azure/docker-login@v1
        with:
          login-server: calcloneacr26.azurecr.io
          username: calcloneacr26
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker build -t calcloneacr26.azurecr.io/cal-clone-api:latest .
          docker push calcloneacr26.azurecr.io/cal-clone-api:latest

      - name: Replace Secrets in Deployment Template
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Use envsubst to safely inject secrets into the YAML file
          export POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
          export ACR_PASSWORD="${{ secrets.ACR_PASSWORD }}"
          export RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}"
          
          # We're writing to deploy-final.yaml which will be ignored by git
          envsubst < deploy/aci-group.yaml > deploy/aci-group-final.yaml

      - name: Deploy Azure Container Group
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          az container create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --file deploy/aci-group-final.yaml
